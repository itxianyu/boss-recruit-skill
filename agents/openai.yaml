interface:
  display_name: "Boss Recruit Skill"
  short_description: "Run natural-language recruiting workflows and generate ranked results plus PDF and Excel outputs."
  default_prompt: "Use $boss-recruit-skill to turn a hiring request into candidate matching results and PDF or Excel output."

dependencies:
  tools:
    - type: "mcp"
      value: "boss-zhipin"
      description: "Boss Zhipin MCP server used for live recruiting and job-search data."

policy:
  allow_implicit_invocation: true
